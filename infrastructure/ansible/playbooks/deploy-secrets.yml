---
- name: Deploy Application Secrets
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - secrets.yml
  vars:
    # Path to the kubeconfig fetched from your Azure VM
    kubeconfig_local_path: "./kubeconfig_azure.yaml"
    namespace: default

    # These variables should be defined in your secrets.yml (Ansible Vault)
    # database_url: "..."
    # nextauth_secret: "..."
    # wso2_issuer: "..."
    
    # Student Portal Specific
    # student_wso2_client_id: "..."
    # student_wso2_client_secret: "..."

    # Library Portal Specific
    # library_wso2_client_id: "..."
    # library_wso2_client_secret: "..."

    # Admin Portal Specific
    # admin_wso2_client_id: "..."
    # admin_wso2_client_secret: "..."
    
  tasks:
    # -------------------------------------------------------
    # 1. Student Portal Secrets
    # -------------------------------------------------------
    - name: Create Student Portal Secrets
      shell: |
        kubectl create secret generic student-portal-secrets \
          --namespace {{ namespace }} \
          --from-literal=DATABASE_URL="{{ database_url }}" \
          --from-literal=AUTH_SECRET="{{ nextauth_secret }}" \
          --from-literal=WSO2_ISSUER="{{ wso2_issuer }}" \
          --from-literal=WSO2_WELL_KNOWN="{{ wso2_well_known }}" \
          --from-literal=WSO2_BASE_URL="{{ wso2_base_url }}" \
          --from-literal=NODE_TLS_REJECT_UNAUTHORIZED="{{ node_tls_reject_unauthorized }}" \
          --from-literal=NEXT_PUBLIC_STUDENT_URL="{{ student_url }}" \
          --from-literal=NEXT_PUBLIC_LIBRARY_URL="{{ library_url }}" \
          --from-literal=NEXT_PUBLIC_ADMIN_URL="{{ admin_url }}" \
          --from-literal=NEXT_PUBLIC_WSO2_LOGOUT_URL="{{ wso2_logout_url }}" \
          --from-literal=AUTH_TRUST_HOST="{{ auth_trust_host | default('true') }}" \
          --from-literal=NEXTAUTH_URL="{{ student_url }}" \
          --from-literal=WSO2_CLIENT_ID="{{ student_wso2_client_id }}" \
          --from-literal=WSO2_CLIENT_SECRET="{{ student_wso2_client_secret }}" \
          --kubeconfig {{ kubeconfig_local_path }} \
          --dry-run=client -o yaml | kubectl apply --kubeconfig {{ kubeconfig_local_path }} -f -
      no_log: true

    # -------------------------------------------------------
    # 2. Library Portal Secrets
    # -------------------------------------------------------
    - name: Create Library Portal Secrets
      shell: |
        kubectl create secret generic library-portal-secrets \
          --namespace {{ namespace }} \
          --from-literal=DATABASE_URL="{{ database_url }}" \
          --from-literal=AUTH_SECRET="{{ nextauth_secret }}" \
          --from-literal=WSO2_ISSUER="{{ wso2_issuer }}" \
          --from-literal=WSO2_WELL_KNOWN="{{ wso2_well_known }}" \
          --from-literal=WSO2_BASE_URL="{{ wso2_base_url }}" \
          --from-literal=NODE_TLS_REJECT_UNAUTHORIZED="{{ node_tls_reject_unauthorized }}" \
          --from-literal=NEXT_PUBLIC_STUDENT_URL="{{ student_url }}" \
          --from-literal=NEXT_PUBLIC_LIBRARY_URL="{{ library_url }}" \
          --from-literal=NEXT_PUBLIC_ADMIN_URL="{{ admin_url }}" \
          --from-literal=NEXT_PUBLIC_WSO2_LOGOUT_URL="{{ wso2_logout_url }}" \
          --from-literal=AUTH_TRUST_HOST="{{ auth_trust_host | default('true') }}" \
          --from-literal=NEXTAUTH_URL="{{ library_url }}" \
          --from-literal=WSO2_CLIENT_ID="{{ library_wso2_client_id }}" \
          --from-literal=WSO2_CLIENT_SECRET="{{ library_wso2_client_secret }}" \
          --kubeconfig {{ kubeconfig_local_path }} \
          --dry-run=client -o yaml | kubectl apply --kubeconfig {{ kubeconfig_local_path }} -f -
      no_log: true

    # -------------------------------------------------------
    # 3. Admin Portal Secrets
    # -------------------------------------------------------
    - name: Create Admin Portal Secrets
      shell: |
        kubectl create secret generic admin-portal-secrets \
          --namespace {{ namespace }} \
          --from-literal=DATABASE_URL="{{ database_url }}" \
          --from-literal=AUTH_SECRET="{{ nextauth_secret }}" \
          --from-literal=WSO2_ISSUER="{{ wso2_issuer }}" \
          --from-literal=WSO2_WELL_KNOWN="{{ wso2_well_known }}" \
          --from-literal=WSO2_BASE_URL="{{ wso2_base_url }}" \
          --from-literal=NODE_TLS_REJECT_UNAUTHORIZED="{{ node_tls_reject_unauthorized }}" \
          --from-literal=NEXT_PUBLIC_STUDENT_URL="{{ student_url }}" \
          --from-literal=NEXT_PUBLIC_LIBRARY_URL="{{ library_url }}" \
          --from-literal=NEXT_PUBLIC_ADMIN_URL="{{ admin_url }}" \
          --from-literal=NEXT_PUBLIC_WSO2_LOGOUT_URL="{{ wso2_logout_url }}" \
          --from-literal=AUTH_TRUST_HOST="{{ auth_trust_host | default('true') }}" \
          --from-literal=NEXTAUTH_URL="{{ admin_url }}" \
          --from-literal=WSO2_CLIENT_ID="{{ admin_wso2_client_id }}" \
          --from-literal=WSO2_CLIENT_SECRET="{{ admin_wso2_client_secret }}" \
          --kubeconfig {{ kubeconfig_local_path }} \
          --dry-run=client -o yaml | kubectl apply --kubeconfig {{ kubeconfig_local_path }} -f -
      no_log: true

    # -------------------------------------------------------
    # 4. Configure CoreDNS (Dynamic WSO2 IP)
    # -------------------------------------------------------
    - name: Get WSO2 Identity Server Service IP
      shell: |
        kubectl get svc wso2-is-identity-server -n wso2is \
        -o jsonpath='{.spec.clusterIP}' \
        --kubeconfig {{ kubeconfig_local_path }}
      register: wso2_svc_ip

    - name: Patch CoreDNS ConfigMap
      shell: |
        kubectl patch configmap coredns -n kube-system --type merge -p '{"data":{"Corefile":".:53 {\n    errors\n    health {\n       lameduck 5s\n    }\n    ready\n    kubernetes cluster.local in-addr.arpa ip6.arpa {\n       pods insecure\n       fallthrough in-addr.arpa ip6.arpa\n       ttl 30\n    }\n    prometheus :9153\n    forward . /etc/resolv.conf\n    cache 30\n    loop\n    reload\n    loadbalance\n    hosts {\n       {{ wso2_svc_ip.stdout }} wso2is.com\n       fallthrough\n    }\n}"}}' --kubeconfig {{ kubeconfig_local_path }}
        
        kubectl rollout restart deployment coredns -n kube-system --kubeconfig {{ kubeconfig_local_path }}
      when: wso2_svc_ip.stdout != ""
