- name: K3s Master Setup
  hosts: k3s_master
  become: true
  vars:
    # It's better to leave this empty for 'latest' or specify a version like v1.28.2+k3s1
    k3s_version: ""
    # Define your public IP here or ensure it's passed via -e "public_ip=..."
    server_ip: "{{ public_ip | default(ansible_host) }}"

  tasks:
    - name: Uninstall any existing k3s
      stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: uninstall_script

    - name: Run k3s uninstall if script exists
      command: /usr/local/bin/k3s-uninstall.sh
      when: uninstall_script.stat.exists

    - name: Update apt packages
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name: 
          - curl
          - htop
        state: present

    - name: Install k3s server
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -s - \
          server \
          --tls-san {{ server_ip }} \
          --write-kubeconfig-mode 644
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Wait for kubeconfig to be generated
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        state: present
        timeout: 30

    - name: Get K3s token
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token_base64

    - name: Store K3s token and Private IP
      set_fact:
        k3s_token: "{{ k3s_token_base64.content | b64decode | trim }}"
        master_private_ip: "{{ private_ip }}"
      delegate_to: localhost
      delegate_facts: true

    - name: Fetch kubeconfig to local machine
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "./kubeconfig_azure.yaml"
        flat: yes

    - name: Replace server IP in kubeconfig with public IP
      delegate_to: localhost
      become: false
      replace:
        path: "./kubeconfig_azure.yaml"
        regexp: 'https://127.0.0.1:6443'
        replace: "https://{{ server_ip }}:6443"

- name: K3s Worker Setup
  hosts: k3s_worker
  become: true
  vars:
    k3s_version: ""

  tasks:
    - name: Uninstall any existing k3s agent
      stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: agent_uninstall_script

    - name: Run k3s agent uninstall if script exists
      command: /usr/local/bin/k3s-agent-uninstall.sh
      when: agent_uninstall_script.stat.exists

    - name: Update apt packages
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install dependencies
      apt:
        name: 
          - curl
          - htop
        state: present

    - name: Install k3s agent
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} K3S_URL=https://{{ hostvars[groups['k3s_master'][0]]['private_ip'] }}:6443 K3S_TOKEN={{ hostvars['localhost']['k3s_token'] }} sh -s - \
          agent \
          --node-label node_type=high_memory \
          --node-taint dedicated=wso2:NoSchedule
      args:
        creates: /etc/systemd/system/k3s-agent.service