apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-portal-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik" # Assuming k3s uses traefik by default
spec:
  rules:
    - http:
        paths:
          - path: /student
            pathType: Prefix
            backend:
              service:
                name: student-portal
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: student-portal
                port:
                  number: 80
