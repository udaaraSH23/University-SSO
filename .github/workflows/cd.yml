name: CD

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME: ${{ github.repository }} # e.g. user/repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - app: student-portal
            dockerfile: apps/student-portal/Dockerfile
            image: university-portal-student
          - app: library-portal
            dockerfile: apps/library-portal/Dockerfile
            image: university-portal-library
          - app: admin-portal
            dockerfile: apps/admin-portal/Dockerfile
            image: university-portal-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/app"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GITHUB_REPOSITORY_OWNER
          script: |
            cd /home/ubuntu/app
            
            # Export environment variables for envsubst or direct usage (though compose needs .env or direct values)
            # For this simple setup, we'll replace the placeholder in the file or set env var in shell
            export GITHUB_REPOSITORY_OWNER=${GITHUB_REPOSITORY_OWNER}

            # Login again just in case (optional if usually logged in)
            # docker login ghcr.io -u ...

            # Pull and Restart
            # We rename the prod file to standard name for convenience or use -f
            mv docker-compose.prod.yml docker-compose.yml
            
            docker compose pull
            docker compose up -d --remove-orphans
            
            echo "Deployment triggered successfully"
