name: CD

on:
  push:
    branches: ["main"]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # IMAGE_NAME: ${{ github.repository }} # e.g. user/repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      matrix:
        include:
          - app: student-portal
            dockerfile: apps/student-portal/Dockerfile
            image: university-portal-student
          - app: library-portal
            dockerfile: apps/library-portal/Dockerfile
            image: university-portal-library
          - app: admin-portal
            dockerfile: apps/admin-portal/Dockerfile
            image: university-portal-admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  update-manifests:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install yq
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq

      - name: Update Manifests
        run: |
          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Normalize owner to lowercase
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')

          # Update image tags in manifests
          # Student Portal
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/$OWNER/university-portal-student:${{ needs.build-and-push.outputs.version }}\"" infrastructure/k8s/apps/student-portal/deployment.yaml
          
          # Library Portal
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/$OWNER/university-portal-library:${{ needs.build-and-push.outputs.version }}\"" infrastructure/k8s/apps/library-portal/deployment.yaml
          
          # Admin Portal
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/$OWNER/university-portal-admin:${{ needs.build-and-push.outputs.version }}\"" infrastructure/k8s/apps/admin-portal/deployment.yaml

          # Commit and Push if changes exist
          if [[ -n $(git status -s) ]]; then
            git add infrastructure/k8s/apps/
            git commit -m "chore(cd): update k8s image tags to ${{ needs.build-and-push.outputs.version }}"
            git push
          else
            echo "No changes to commit"
          fi
