sonar.projectKey=UniversityPortal
sonar.projectName=UniversityPortal
sonar.projectVersion=1.0

# Modules - using simple keys to avoid invalid characters (slashes)
sonar.modules=admin-portal,library-portal,student-portal,backend,ui,auth,database

# Global Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/build/**,**/coverage/**,**/*.spec.tsx,**/*.test.tsx,**/*.spec.ts,**/*.test.ts

# Source Encoding
sonar.sourceEncoding=UTF-8

# Default Server URL
sonar.host.url=http://localhost:9000

# JavaScript/TypeScript specific
# Assuming coverage files are generated in each module's root if tests are run
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Module specific configurations

# Admin Portal
admin-portal.sonar.projectBaseDir=apps/admin-portal
admin-portal.sonar.projectName=Admin Portal
admin-portal.sonar.sources=src
admin-portal.sonar.tests=src
admin-portal.sonar.test.inclusions=**/*.test.tsx,**/*.spec.tsx,**/*.test.ts,**/*.spec.ts

# Library Portal
library-portal.sonar.projectBaseDir=apps/library-portal
library-portal.sonar.projectName=Library Portal
library-portal.sonar.sources=src
library-portal.sonar.tests=src
library-portal.sonar.test.inclusions=**/*.test.tsx,**/*.spec.tsx,**/*.test.ts,**/*.spec.ts

# Student Portal
student-portal.sonar.projectBaseDir=apps/student-portal
student-portal.sonar.projectName=Student Portal
student-portal.sonar.sources=src
student-portal.sonar.tests=src
student-portal.sonar.test.inclusions=**/*.test.tsx,**/*.spec.tsx,**/*.test.ts,**/*.spec.ts

# Backend
backend.sonar.projectBaseDir=packages/backend
backend.sonar.projectName=Backend Package
backend.sonar.sources=src
backend.sonar.tests=src
backend.sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# UI
ui.sonar.projectBaseDir=packages/ui
ui.sonar.projectName=UI Package
ui.sonar.sources=src
ui.sonar.tests=src
ui.sonar.test.inclusions=**/*.test.tsx,**/*.spec.tsx

# Auth
auth.sonar.projectBaseDir=packages/auth
auth.sonar.projectName=Auth Package
auth.sonar.sources=.

# Database
database.sonar.projectBaseDir=packages/database
database.sonar.projectName=Database Package
database.sonar.sources=.
database.sonar.exclusions=prisma/**
