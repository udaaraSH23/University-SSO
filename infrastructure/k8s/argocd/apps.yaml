apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: student-portal
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/udaaraSH23/University-SSO.git # Assuming this is the repo based on context
    targetRevision: main
    path: infrastructure/k8s/apps/student-portal
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
