apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-portal-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  tls:
    - hosts:
        - library.local
      secretName: portal-tls-cert
  rules:
    - host: library.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: library-portal
                port:
                  number: 80
